# This nginx config is used inside the production frontend container.
# In dev mode, Vite's built-in proxy handles /api → backend.
# In production (docker compose), nginx does the same job.

server {
    listen 80;

    # Serve the built React app from this directory
    root /usr/share/nginx/html;
    index index.html;

    # Any route that doesn't match a static file falls back to index.html.
    # This is required for React Router (client-side routing) to work —
    # without it, refreshing /chat would return a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/ requests to the FastAPI backend container.
    # "backend" is the Docker Compose service name — Docker's internal DNS
    # resolves it to the backend container's IP automatically.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # These headers are required for SSE (Server-Sent Events) to work
        # through nginx. Without them, nginx buffers the response and the
        # browser doesn't receive tokens in real time.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
